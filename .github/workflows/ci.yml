name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Biome
        run: npx biome ci .

      - name: Typecheck
        run: |
          npx next typegen
          npx tsc --noEmit

      # Full `next build` prerenders pages against Supabase, which needs
      # production secrets; compile mode checks the bundle without them.
      - name: Build
        run: npx next build --experimental-build-mode=compile
